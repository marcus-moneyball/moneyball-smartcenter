<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moneyball — Aprovar Rodada</title>
<style>
  :root {
    --bg: #05070d;
    --panel: #0d1220;
    --card: #111827;
    --border: #1f2937;
    --accent: #00e676;
    --accent-dim: #00c853;
    --text: #e5e7eb;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 1.25rem;
    max-width: 720px;
    margin-inline: auto;
  }
  h1 { font-size: 1.3rem; margin: 0 0 0.25rem; }
  .subtitulo { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
  #config {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 1rem; margin-bottom: 1.25rem;
  }
  #config label { font-size: 0.75rem; color: var(--muted); display: block; margin-bottom: 0.3rem; }
  #config input {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.6rem; font-family: inherit; margin-bottom: 0.6rem;
  }
  button {
    font-family: inherit; font-weight: 700; border: none; border-radius: 8px;
    padding: 0.7rem 1.1rem; cursor: pointer;
  }
  .btn-primario { background: var(--accent); color: #000; }
  .btn-primario:hover { background: var(--accent-dim); }
  .btn-primario:disabled { opacity: 0.5; cursor: wait; }
  #lista { display: flex; flex-direction: column; gap: 0.75rem; }
  .jogo {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 1rem; display: flex; gap: 0.75rem; align-items: flex-start;
  }
  .jogo input[type="checkbox"] { width: 20px; height: 20px; margin-top: 0.2rem; accent-color: var(--accent); }
  .jogo-titulo { font-weight: 700; font-size: 1rem; }
  .jogo-liga { color: var(--muted); font-size: 0.75rem; margin-top: 0.15rem; }
  .score {
    display: inline-block; margin-top: 0.4rem; font-size: 0.7rem; font-weight: 700;
    background: rgba(0,230,118,0.15); color: var(--accent); padding: 2px 8px; border-radius: 999px;
  }
  .motivos { font-size: 0.75rem; color: var(--muted); margin-top: 0.4rem; }
  #rodape { position: sticky; bottom: 0; background: var(--bg); padding-top: 1rem; margin-top: 1rem; }
  #status { font-size: 0.85rem; color: #ffca28; margin-top: 0.6rem; }
  .vazio { color: var(--muted); text-align: center; padding: 2rem 0; font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>Aprovar rodada de hoje</h1>
  <p class="subtitulo">Marque os jogos que quer publicar no Ghost. Ordenado por score de hype.</p>

  <div id="config">
    <label>URL do backend</label>
    <input id="backend-url" placeholder="https://seu-projeto.vercel.app">
    <label>CRON_SECRET</label>
    <input id="backend-secret" type="password" placeholder="cole aqui">
    <button class="btn-primario" onclick="carregarLista()">Carregar lista de hoje</button>
  </div>

  <div id="lista"></div>

  <div id="rodape" style="display:none;">
    <button class="btn-primario" id="btn-aprovar" onclick="aprovarSelecionados()">Aprovar selecionados</button>
    <div id="status"></div>
  </div>

<script>
  const LS_URL = 'moneyball_backend_url';
  const LS_SECRET = 'moneyball_backend_secret';

  document.getElementById('backend-url').value = localStorage.getItem(LS_URL) || '';
  document.getElementById('backend-secret').value = localStorage.getItem(LS_SECRET) || '';

  function config() {
    const url = document.getElementById('backend-url').value.trim().replace(/\/$/, '');
    const secret = document.getElementById('backend-secret').value.trim();
    localStorage.setItem(LS_URL, url);
    localStorage.setItem(LS_SECRET, secret);
    return { url, secret };
  }

  async function carregarLista() {
    const { url, secret } = config();
    const lista = document.getElementById('lista');
    const rodape = document.getElementById('rodape');
    lista.innerHTML = '<p class="vazio">Carregando...</p>';
    rodape.style.display = 'none';

    try {
      const resp = await fetch(`${url}/api/lista-do-dia`, {
        headers: { Authorization: `Bearer ${secret}` },
      });
      const dados = await resp.json();

      if (!resp.ok || !dados.sucesso) {
        lista.innerHTML = `<p class="vazio">Erro: ${dados.erro || resp.status}</p>`;
        return;
      }

      if (dados.jogos.length === 0) {
        lista.innerHTML = '<p class="vazio">Nenhum jogo coletado hoje ainda.</p>';
        return;
      }

      lista.innerHTML = dados.jogos.map((jogo) => `
        <label class="jogo">
          <input type="checkbox" value="${jogo.id}">
          <div>
            <div class="jogo-titulo">${jogo.timeCasa} x ${jogo.timeVisitante}</div>
            <div class="jogo-liga">${jogo.ligaNome}</div>
            <span class="score">Score ${jogo.hype.score}</span>
            <div class="motivos">${jogo.hype.motivos.join(' · ') || 'Sem sinais de hype específicos'}</div>
          </div>
        </label>
      `).join('');

      rodape.style.display = 'block';
    } catch (e) {
      lista.innerHTML = `<p class="vazio">Erro de conexão: ${e.message}</p>`;
    }
  }

  async function aprovarSelecionados() {
    const { url, secret } = config();
    const selecionados = Array.from(document.querySelectorAll('#lista input:checked')).map((el) => Number(el.value));
    const status = document.getElementById('status');
    const btn = document.getElementById('btn-aprovar');

    if (selecionados.length === 0) {
      alert('Marque pelo menos um jogo.');
      return;
    }

    btn.disabled = true;
    status.textContent = `⏳ Analisando e publicando ${selecionados.length} jogo(s)... pode demorar um pouco.`;

    try {
      const resp = await fetch(`${url}/api/aprovar-jogos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${secret}` },
        body: JSON.stringify({ fixture_ids: selecionados }),
      });
      const dados = await resp.json();

      if (!resp.ok || !dados.sucesso) {
        status.textContent = `❌ Erro: ${dados.erro || resp.status}`;
        return;
      }

      const ok = dados.resultados.filter((r) => r.sucesso).length;
      status.textContent = `✅ ${ok}/${dados.resultados.length} publicados como rascunho no Ghost.`;
    } catch (e) {
      status.textContent = `❌ Erro de conexão: ${e.message}`;
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
