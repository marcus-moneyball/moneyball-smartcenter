<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moneyball Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
          mono: ['JetBrains Mono', 'monospace'],
          display: ['"Bebas Neue"', 'sans-serif'],
        },
        colors: {
          base: { bg: '#0a0c10', panel: '#12151c', card: '#171b22', border: '#262b35' },
          accent: { DEFAULT: '#f2b134', dim: '#caa233', soft: '#f2b13422' },
          value: { DEFAULT: '#34d399' },
          risk: { DEFAULT: '#f87171' },
        }
      }
    }
  }
</script>
<style>
  .fade-up { animation: fadeUp .35s ease-out both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body class="bg-base-bg text-slate-200 font-sans min-h-screen" style="background-image: radial-gradient(circle at 50% -10%, rgba(242,177,52,0.07), transparent 55%);">
  <div class="max-w-2xl mx-auto p-4 md:p-8 space-y-6">

    <!-- HEADER -->
    <div class="text-center space-y-1.5 pt-2">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-accent/10 border border-accent/25 text-[10px] font-bold text-accent tracking-widest uppercase">
        <span class="w-1.5 h-1.5 rounded-full bg-accent animate-pulse"></span> Radar → SmartCenter
      </div>
      <h1 class="font-display text-4xl md:text-5xl text-white tracking-wide">SCANNER</h1>
      <p class="text-xs text-slate-500">Cole o JSON do Moneyball Radar — cada pick é cruzado com o banco antes de ir pro Ghost.</p>
      <p class="text-[11px] pt-1">
        <a href="/index.html" class="text-slate-500 hover:text-accent transition-colors">← Painel do dia</a>
        <span class="text-slate-700 mx-1.5">·</span>
        <a href="/resultados.html" class="text-slate-500 hover:text-accent transition-colors">Resultados/ROI →</a>
      </p>
    </div>

    <!-- CONFIG -->
    <div id="config" class="bg-base-panel border border-base-border rounded-2xl p-5 space-y-3">
      <div>
        <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide block mb-1">URL do backend</label>
        <input id="backend-url" placeholder="https://seu-projeto.vercel.app" class="w-full bg-base-bg px-3 py-2 rounded-lg border border-base-border text-slate-300 text-sm font-mono focus:border-accent outline-none">
      </div>
      <div>
        <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wide block mb-1">CRON_SECRET</label>
        <input id="backend-secret" type="password" placeholder="cole aqui" class="w-full bg-base-bg px-3 py-2 rounded-lg border border-base-border text-slate-300 text-sm font-mono focus:border-accent outline-none">
      </div>
    </div>

    <!-- INPUT DO JSON -->
    <div id="input-box" class="bg-base-panel border border-base-border rounded-2xl p-6 space-y-4">
      <label class="text-xs font-semibold text-slate-300 uppercase tracking-wide block">Dossiê do Radar (JSON)</label>
      <textarea id="radar-json" class="w-full h-40 bg-base-bg p-3 rounded-lg border border-base-border font-mono text-[11px] text-slate-400 focus:text-slate-200 focus:border-accent outline-none transition-colors" placeholder='Cole o JSON completo do Radar aqui (radar_metadata, resumo_rodada, picks_by_sport)...'></textarea>
      <button id="processar-btn" type="button" onclick="processarRodada()" class="w-full py-3.5 bg-accent hover:bg-accent-dim font-bold rounded-xl text-base-bg shadow-lg shadow-accent/20 transition-all flex items-center justify-center gap-2 cursor-pointer">
        <i class="fa-solid fa-magnifying-glass"></i> Processar Rodada
      </button>
    </div>

    <!-- NOVA RODADA -->
    <div id="new-round-bar" class="hidden">
      <button type="button" onclick="resetarScanner()" class="w-full py-3 bg-base-panel hover:bg-base-card border border-accent/40 rounded-xl text-accent font-bold text-sm flex items-center justify-center gap-2 transition-all cursor-pointer">
        <i class="fa-solid fa-plus"></i> Nova Rodada
      </button>
    </div>

    <!-- RESUMO DA RODADA -->
    <div id="resumo-rodada"></div>

    <!-- DISPLAY DE ITENS -->
    <div id="display-area" class="space-y-3"></div>
  </div>

<script>
  const LS_URL = 'moneyball_backend_url';
  const LS_SECRET = 'moneyball_backend_secret';

  document.getElementById('backend-url').value = localStorage.getItem(LS_URL) || '';
  document.getElementById('backend-secret').value = localStorage.getItem(LS_SECRET) || '';

  const ICONE_ESPORTE = { futebol: 'fa-futbol', basquete: 'fa-basketball', beisebol: 'fa-baseball' };

  function config() {
    const url = document.getElementById('backend-url').value.trim().replace(/\/$/, '');
    const secret = document.getElementById('backend-secret').value.trim();
    localStorage.setItem(LS_URL, url);
    localStorage.setItem(LS_SECRET, secret);
    return { url, secret };
  }

  function escaparHtml(texto) {
    const div = document.createElement('div');
    div.textContent = String(texto ?? '');
    return div.innerHTML;
  }

  async function processarRodada() {
    const { url, secret } = config();
    const btn = document.getElementById('processar-btn');
    const raw = document.getElementById('radar-json').value.trim();

    if (!url) { alert('Preencha a URL do backend.'); return; }
    if (!raw) { alert('Cole o JSON do Radar.'); return; }

    let radarJson;
    try {
      radarJson = JSON.parse(raw);
    } catch (e) {
      alert('JSON inválido: ' + e.message);
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Cruzando com o banco...';

    try {
      const resp = await fetch(`${url}/api/scanner/processar`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${secret}` },
        body: JSON.stringify(radarJson),
      });
      const dados = await resp.json();

      if (!resp.ok || !dados.sucesso) {
        document.getElementById('display-area').innerHTML = alertaErro(dados.erro || `HTTP ${resp.status}`);
        return;
      }

      document.getElementById('input-box').classList.add('hidden');
      document.getElementById('new-round-bar').classList.remove('hidden');
      renderizarResumo(dados);
      renderizarItens(dados.itens);
    } catch (e) {
      document.getElementById('display-area').innerHTML = alertaErro(`Erro de conexão: ${e.message}`);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i> Processar Rodada';
    }
  }

  function renderizarResumo(dados) {
    const div = document.getElementById('resumo-rodada');
    div.innerHTML = `
      <div class="bg-base-panel border border-base-border rounded-xl p-4 flex items-center justify-between gap-3 fade-up">
        <p class="text-xs text-slate-400 flex-1">${escaparHtml(dados.resumo_rodada || 'Sem resumo informado pelo Radar.')}</p>
        <div class="flex gap-2 shrink-0">
          <span class="text-[10px] font-bold text-value bg-value/10 border border-value/30 px-2 py-1 rounded-lg">${dados.prontos} prontos</span>
          <span class="text-[10px] font-bold text-risk bg-risk/10 border border-risk/30 px-2 py-1 rounded-lg">${dados.bloqueados} bloqueados</span>
        </div>
      </div>
    `;
  }

  function renderizarItens(itens) {
    const display = document.getElementById('display-area');
    display.innerHTML = itens.map((item, idx) => renderizarCard(item, idx)).join('');
  }

  function renderizarCard(item, idx) {
    const p = item.pick;
    const bloqueado = item.status === 'bloqueado';
    const icone = ICONE_ESPORTE[p.esporte] || 'fa-circle-question';

    return `
      <div id="card-${idx}" class="bg-base-panel border ${bloqueado ? 'border-base-border opacity-60' : 'border-accent/30'} rounded-2xl p-5 space-y-3 fade-up">
        <div class="flex items-start justify-between gap-3">
          <div class="flex items-center gap-2">
            <i class="fa-solid ${icone} text-accent text-sm"></i>
            <div>
              <h3 class="text-sm font-bold text-white">${escaparHtml(p.match)}</h3>
              <p class="text-[11px] text-slate-500">${escaparHtml(p.league || '')}</p>
            </div>
          </div>
          <span class="text-[10px] font-bold uppercase tracking-wide px-2 py-1 rounded-lg ${bloqueado ? 'text-risk bg-risk/10 border border-risk/30' : 'text-value bg-value/10 border border-value/30'}">
            ${bloqueado ? 'Bloqueado' : 'Pronto'}
          </span>
        </div>

        ${bloqueado
          ? `<p class="text-xs text-risk bg-risk/5 border border-risk/20 rounded-lg px-3 py-2"><i class="fa-solid fa-triangle-exclamation mr-1"></i> ${escaparHtml(item.motivo_bloqueio)}</p>`
          : `
            <div class="bg-base-bg rounded-xl p-3 space-y-1.5 border border-base-border">
              <div class="flex justify-between items-baseline">
                <span class="text-xs text-slate-400">${escaparHtml(p.market)}</span>
                <span class="text-[11px] font-mono text-accent font-bold">EV ${p.edge_percentage >= 0 ? '+' : ''}${p.edge_percentage}%</span>
              </div>
              <div class="text-base font-bold text-white">${escaparHtml(p.selection)}</div>
              <div class="text-[11px] font-mono text-slate-500">Odd ${p.current_odds} · Bet to ${p.bet_to ?? '—'} · ${p.units ?? 0}u</div>
              ${p.game_script_leitura ? `<p class="text-[11px] text-slate-400 pt-1 border-t border-base-border/60 mt-1.5">${escaparHtml(p.game_script_leitura)}</p>` : ''}
            </div>
            <button type="button" onclick='publicarPick(${idx}, ${JSON.stringify(p)}, ${JSON.stringify(item.fixture)})' id="publicar-btn-${idx}" class="w-full py-2.5 bg-accent hover:bg-accent-dim font-bold rounded-lg text-base-bg text-sm transition-all flex items-center justify-center gap-2 cursor-pointer">
              <i class="fa-brands fa-ghost"></i> Publicar no Ghost
            </button>
          `
        }
      </div>
    `;
  }

  async function publicarPick(idx, pick, fixture) {
    const { url, secret } = config();
    const btn = document.getElementById(`publicar-btn-${idx}`);
    const card = document.getElementById(`card-${idx}`);

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Publicando...';

    try {
      const resp = await fetch(`${url}/api/scanner/publicar`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${secret}` },
        body: JSON.stringify({ pick, fixture }),
      });
      const dados = await resp.json();

      if (!resp.ok || !dados.sucesso) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-brands fa-ghost"></i> Publicar no Ghost';
        alert(`Erro ao publicar: ${dados.erro || resp.status}`);
        return;
      }

      card.classList.add('border-value');
      btn.outerHTML = `<a href="${dados.url}" target="_blank" class="w-full py-2.5 bg-value/10 border border-value/40 text-value font-bold rounded-lg text-sm text-center flex items-center justify-center gap-2"><i class="fa-solid fa-check-circle"></i> Publicado — ver no Ghost</a>`;
    } catch (e) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-brands fa-ghost"></i> Publicar no Ghost';
      alert(`Erro de conexão: ${e.message}`);
    }
  }

  function resetarScanner() {
    document.getElementById('input-box').classList.remove('hidden');
    document.getElementById('new-round-bar').classList.add('hidden');
    document.getElementById('radar-json').value = '';
    document.getElementById('resumo-rodada').innerHTML = '';
    document.getElementById('display-area').innerHTML = '';
  }

  function alertaErro(msg) {
    return `<div class="bg-risk/10 border border-risk/40 text-risk text-sm p-4 rounded-xl">⚠️ ${escaparHtml(msg)}</div>`;
  }
</script>
</body>
</html>
