<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moneyball — Painel do Dia</title>
<style>
  :root {
    --bg: #05070d;
    --panel: #0d1220;
    --card: #111827;
    --border: #1f2937;
    --accent: #00e676;
    --accent-dim: #00c853;
    --text: #e5e7eb;
    --muted: #6b7280;
    --erro: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 1.25rem;
    max-width: 780px;
    margin-inline: auto;
  }
  h1 { font-size: 1.3rem; margin: 0 0 0.25rem; }
  .subtitulo { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.25rem; }
  #config {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 1rem; margin-bottom: 1.5rem;
  }
  #config label { font-size: 0.75rem; color: var(--muted); display: block; margin-bottom: 0.3rem; }
  #config input {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.6rem; font-family: inherit; margin-bottom: 0.6rem;
  }
  button {
    font-family: inherit; font-weight: 700; border: none; border-radius: 8px;
    padding: 0.65rem 1.1rem; cursor: pointer;
  }
  .btn-primario { background: var(--accent); color: #000; width: 100%; }
  .btn-primario:hover { background: var(--accent-dim); }

  .liga-secao { margin-bottom: 1.75rem; }
  .liga-titulo {
    display: flex; align-items: center; gap: 0.5rem; font-size: 1rem; font-weight: 800;
    margin-bottom: 0.6rem; padding-bottom: 0.4rem; border-bottom: 1px solid var(--border);
  }
  .liga-emoji { font-size: 1.2rem; }

  .jogo {
    width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 0.9rem 1rem; margin-bottom: 0.6rem; cursor: pointer;
    transition: border-color .15s, opacity .15s;
    display: flex; justify-content: space-between; align-items: center; gap: 0.75rem;
  }
  .jogo:hover:not(:disabled) { border-color: var(--accent); }
  .jogo:disabled { cursor: wait; opacity: 0.7; }
  .jogo.publicado { border-color: var(--accent); background: rgba(0,230,118,0.06); }
  .jogo.erro { border-color: var(--erro); }

  .jogo-info { flex: 1; min-width: 0; }
  .jogo-titulo { font-weight: 700; font-size: 0.95rem; }
  .jogo-detalhe { font-size: 0.7rem; color: var(--muted); margin-top: 0.25rem; }
  .score {
    font-size: 0.7rem; font-weight: 700; background: rgba(0,230,118,0.15); color: var(--accent);
    padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  }
  .jogo-status { font-size: 0.75rem; white-space: nowrap; flex-shrink: 0; }
  .jogo-status.ok { color: var(--accent); }
  .jogo-status.erro-txt { color: var(--erro); }
  .jogo-status.andamento { color: #ffca28; }

  .vazio { color: var(--muted); text-align: center; padding: 2rem 0; font-size: 0.9rem; }
</style>
</head>
<body>
  <h1>Painel do dia</h1>
  <p class="subtitulo"><a href="/resultados.html" style="color:#00e676;">→ Ver ROI e registrar resultados</a></p>
  <p class="subtitulo">Clique num jogo pra analisar e publicar no Ghost.</p>

  <div id="config">
    <label>URL do backend</label>
    <input id="backend-url" placeholder="https://seu-projeto.vercel.app">
    <label>CRON_SECRET</label>
    <input id="backend-secret" type="password" placeholder="cole aqui">
    <button class="btn-primario" onclick="carregarPainel()">Carregar jogos de hoje</button>
  </div>

  <div id="conteudo"></div>

<script>
  const LS_URL = 'moneyball_backend_url';
  const LS_SECRET = 'moneyball_backend_secret';

  const EMOJI_POR_LIGA = {
    'Brasileirão Série A': '🇧🇷',
    'Premier League': '🏴',
    'Copa Libertadores': '🏆',
    'Champions League': '⭐',
    'La Liga': '🇪🇸',
    'Bundesliga': '🇩🇪',
    'Ligue 1': '🇫🇷',
    'Serie A': '🇮🇹',
    'Europa League': '🏆',
    'NBA': '🏀',
    'MLB': '⚾',
  };

  document.getElementById('backend-url').value = localStorage.getItem(LS_URL) || '';
  document.getElementById('backend-secret').value = localStorage.getItem(LS_SECRET) || '';

  function config() {
    const url = document.getElementById('backend-url').value.trim().replace(/\/$/, '');
    const secret = document.getElementById('backend-secret').value.trim();
    localStorage.setItem(LS_URL, url);
    localStorage.setItem(LS_SECRET, secret);
    return { url, secret };
  }

  function agruparPorLiga(jogos) {
    const grupos = {};
    for (const jogo of jogos) {
      const chave = jogo.ligaNome || 'Outros';
      if (!grupos[chave]) grupos[chave] = [];
      grupos[chave].push(jogo);
    }
    return grupos;
  }

  async function carregarPainel() {
    const { url, secret } = config();
    const conteudo = document.getElementById('conteudo');
    conteudo.innerHTML = '<p class="vazio">Carregando...</p>';

    try {
      const resp = await fetch(`${url}/api/lista-do-dia`, {
        headers: { Authorization: `Bearer ${secret}` },
      });
      const dados = await resp.json();

      if (!resp.ok || !dados.sucesso) {
        conteudo.innerHTML = `<p class="vazio">Erro: ${dados.erro || resp.status}</p>`;
        return;
      }

      if (dados.jogos.length === 0) {
        conteudo.innerHTML = '<p class="vazio">Nenhum jogo coletado hoje ainda.</p>';
        return;
      }

      const grupos = agruparPorLiga(dados.jogos);
      conteudo.innerHTML = Object.entries(grupos).map(([liga, jogos]) => `
        <div class="liga-secao">
          <div class="liga-titulo">
            <span class="liga-emoji">${EMOJI_POR_LIGA[liga] || '⚽'}</span>
            <span>${liga}</span>
          </div>
          ${jogos.map((jogo) => `
            <button class="jogo" id="jogo-${jogo.id}" onclick="analisarEPublicar(${jogo.id})">
              <div class="jogo-info">
                <div class="jogo-titulo">${jogo.timeCasa} x ${jogo.timeVisitante}</div>
                <div class="jogo-detalhe">${jogo.hype.motivos.join(' · ') || 'Sem sinais de hype específicos'}</div>
              </div>
              <span class="score">Score ${jogo.hype.score}</span>
              <span class="jogo-status" id="status-${jogo.id}"></span>
            </button>
          `).join('')}
        </div>
      `).join('');
    } catch (e) {
      conteudo.innerHTML = `<p class="vazio">Erro de conexão: ${e.message}</p>`;
    }
  }

  async function analisarEPublicar(fixtureId) {
    const { url, secret } = config();
    const botao = document.getElementById(`jogo-${fixtureId}`);
    const status = document.getElementById(`status-${fixtureId}`);

    botao.disabled = true;
    status.className = 'jogo-status andamento';
    status.textContent = '⏳ Analisando...';

    try {
      const resp = await fetch(`${url}/api/aprovar-jogos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${secret}` },
        body: JSON.stringify({ fixture_ids: [fixtureId] }),
      });
      const dados = await resp.json();
      const resultado = dados.resultados?.[0];

      if (!resp.ok || !dados.sucesso || !resultado?.sucesso) {
        botao.classList.add('erro');
        status.className = 'jogo-status erro-txt';
        status.textContent = `❌ ${resultado?.erros?.[0] || dados.erro || 'Erro'}`;
        botao.disabled = false;
        return;
      }

      botao.classList.add('publicado');
      status.className = 'jogo-status ok';
      status.textContent = '✅ Publicado no Ghost';
    } catch (e) {
      botao.classList.add('erro');
      status.className = 'jogo-status erro-txt';
      status.textContent = `❌ ${e.message}`;
      botao.disabled = false;
    }
  }
</script>
</body>
</html>
